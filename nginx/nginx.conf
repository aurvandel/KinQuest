# ==============================================================================
# GLOBAL SETTINGS
# ==============================================================================
user  nginx;
worker_processes  auto; # Automatically optimizes based on your Pi's CPU cores

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024; # Total simultaneous players Nginx can handle per core
}

# ==============================================================================
# HTTP MULTIMEDIA & PROXY ROUTING Engine
# ==============================================================================
http {
    # Include standard file structures (ensures CSS/JS files load correctly)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging formats
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Hide nginx version from error pages and headers
    server_tokens off;

    # Performance optimizations for offline hardware
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Docker's internal DNS resolver — required so nginx can resolve
    # service hostnames (kinquest-app) without an external DNS server.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Image uploads are base64-encoded JSON; a 2MB photo becomes ~2.7MB in
    # the request body. 20m gives plenty of headroom.
    client_max_body_size 20m;

    # Gzip Compression (Saves phone battery and bandwidth in the woods)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;  # Don't compress tiny responses — overhead not worth it
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ==========================================================================
    # 1. HTTP GATEWAY (PORT 80)
    # Captive portal probes must be answered here (before the TLS redirect),
    # because the OS sends them as plain HTTP and expects a specific response.
    # Without these, iOS shows "⚠ Not Secure", Android shows "Limited
    # connectivity", and Windows shows the yellow exclamation on the WiFi icon.
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # iOS / macOS captive portal check
        # Expects exactly this HTML body with a 200 status.
        location /hotspot-detect.html {
            default_type text/html;
            return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>';
        }

        # Android / ChromeOS captive portal check
        # Expects an empty 204 No Content response.
        location /generate_204 {
            return 204;
        }

        # Android variant used on some devices/builds.
        location /gen_204 {
            return 204;
        }

        # Windows NCSI check
        # Expects the literal text "Microsoft Connect Test" with no newline.
        location /connecttest.txt {
            default_type text/plain;
            return 200 'Microsoft Connect Test';
        }

        # Windows legacy NCSI endpoint.
        location /ncsi.txt {
            default_type text/plain;
            return 200 'Microsoft NCSI';
        }

        # Firefox captive portal probe endpoint.
        location /success.txt {
            default_type text/plain;
            return 200 'success';
        }

        # Apple fallback endpoint seen on some versions.
        location /library/test/success.html {
            default_type text/html;
            return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>';
        }

        # Windows fallback redirect check
        location /redirect {
            return 204;
        }

        # Everything else: upgrade to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # 2. HTTPS GATEWAY (PORT 443) - SECURE REVERSE PROXY SHIELD
    # ==========================================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # Wildcard SSL Certificates mounted inside the container volumes
        ssl_certificate     /etc/nginx/certs/wildcard_.narcolepsy.ninja.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard_.narcolepsy.ninja.key;

        # Modern, secure SSL configurations compatible with modern smartphones
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # CAPPORT API endpoint advertised via DHCP option 114.
        location /capport {
            default_type application/captive+json;
            return 200 '{"captive": true, "user-portal-url": "https://watkins.narcolepsy.ninja/"}';
        }

        # Main Routing Proxy Layer
        location / {
            # Route traffic internally straight to your container's service name
            proxy_pass http://kinquest-app:3000;
            
            # Pass essential real-world network headers to the KinQuest App
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Core WebSocket Support (Ensures persistent real-time connections)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout before giving up on the upstream connecting
            proxy_connect_timeout 10s;

            # Keep connections alive during heavy game interactions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

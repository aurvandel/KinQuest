# ==============================================================================
# GLOBAL SETTINGS
# ==============================================================================
user  nginx;
worker_processes  auto; # Automatically optimizes based on your Pi's CPU cores

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024; # Total simultaneous players Nginx can handle per core
}

# ==============================================================================
# HTTP MULTIMEDIA & PROXY ROUTING Engine
# ==============================================================================
http {
    # Include standard file structures (ensures CSS/JS files load correctly)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging formats
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimizations for offline hardware
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression (Saves phone battery and bandwidth in the woods)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ==========================================================================
    # 1. HTTP GATEWAY (PORT 80) - FORCE REDIRECT TO SECURE HTTPS
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Intercepts fallback captive portal checks from smartphones
        # and forcefully upgrades them to your secure SSL site
        return 301 https://$host$request_uri;
    }

    # ==========================================================================
    # 2. HTTPS GATEWAY (PORT 443) - SECURE REVERSE PROXY SHIELD
    # ==========================================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # Wildcard SSL Certificates mounted inside the container volumes
        ssl_certificate     /etc/nginx/certs/wildcard_.narcolepsy.ninja.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard_.narcolepsy.ninja.key;

        # Modern, secure SSL configurations compatible with modern smartphones
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Main Routing Proxy Layer
        location / {
            # Route traffic internally straight to your container's service name
            proxy_pass http://kinquest-app:3000;
            
            # Pass essential real-world network headers to the KinQuest App
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Core WebSocket Support (Ensures persistent real-time connections)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Keep connections alive during heavy game interactions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

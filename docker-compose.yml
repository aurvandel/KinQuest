services:
  # ----------------------------------------------------
  # 1. KinQuest Node.js Application container
  # ----------------------------------------------------
  kinquest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinquest-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Links automatically to the internal Kong API gateway
      - SUPABASE_URL=${SUPABASE_URL:-http://kong:8000}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      # Place your personal Gemini API key here for AI-powered verification
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Admin password for access control
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Image upload directory (inside container)
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
    volumes:
      # Mount the uploads volume to persist images
      - app-uploads:/app/uploads
      # Mount db.json for local fallback database persistence
      - app-data-local:/app/data
    depends_on:
      - kong
      - db

  # ----------------------------------------------------
  # 2. Local Supabase: PostgreSQL Database Engine
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: supabase-local-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Auto-run table creations, schema configurations and seeds on initial container birth
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - supabase-db-data:/var/lib/postgresql/data

  # ----------------------------------------------------
  # 3. Local Supabase: PostgREST API Generator
  # ----------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: supabase-local-rest
    restart: always
    environment:
      # Handshake connection to postgres database via our secure authenticator role
      - PGRST_DB_URI=postgres://authenticator:postgres-super-secure-authenticator-password@db:5432/postgres
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
    depends_on:
      - db

  # ----------------------------------------------------
  # 4. Local Supabase: Kong Declarative Gateway
  # ----------------------------------------------------
  kong:
    image: kong:2.8.4-alpine
    container_name: supabase-local-kong
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
    volumes:
      - ./supabase/kong.yml:/usr/local/kong/kong.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      - rest

volumes:
  supabase-db-data:
  app-uploads:
  app-data-local:

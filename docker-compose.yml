services:
  # ----------------------------------------------------
  # 1. KinQuest Node.js Application container
  # ----------------------------------------------------
  kinquest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinquest-app
    restart: always
    command:
      - sh
      - -c
      - |
        until node -e "const net=require('net');const s=net.connect(8000,'kong');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000);"; do
          echo "Waiting for kong:8000...";
          sleep 1;
        done
        npm run start
    ports:
      - "${HTTP_PORT:-3000}:${HTTP_PORT:-3000}"
      - "${HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"
    environment:
      - NODE_ENV=production
      # Links automatically to the internal Kong API gateway
      - SUPABASE_URL=${SUPABASE_URL:-http://kong:8000}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      # Place your personal Gemini API key here for AI-powered verification
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Admin password for access control
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Image upload directory (inside container)
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - TILE_CACHE_DIR=${TILE_CACHE_DIR:-/app/tile-cache}
      # HTTP/HTTPS mode and ports
      - SERVER_PROTOCOL=${SERVER_PROTOCOL:-auto}
      - HTTP_PORT=${HTTP_PORT:-3000}
      - HTTPS_PORT=${HTTPS_PORT:-3443}
      - TILE_UPSTREAM_TIMEOUT_MS=${TILE_UPSTREAM_TIMEOUT_MS:-1000}
      # Optional HTTPS cert/key paths (inside container)
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
      - SSL_CA_PATH=${SSL_CA_PATH:-}
    volumes:
      # Mount the uploads volume to persist images
      - ./uploads:/app/uploads
      # Mount the tile cache volume to persist satellite map tiles (offline support)
      - ./tile-cache:/app/tile-cache
      # Mount host certificates for optional HTTPS support
      - /etc/ssl:/etc/ssl:ro
    depends_on:
      kong:
        condition: service_healthy
      db:
        condition: service_healthy

  # ----------------------------------------------------
  # 2. Local Supabase: PostgreSQL Database Engine
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: supabase-local-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Auto-run table creations, schema configurations and seeds on initial container birth
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - supabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------
  # 3. Local Supabase: PostgREST API Generator
  # ----------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: supabase-local-rest
    restart: always
    environment:
      # Handshake connection to postgres database via our secure authenticator role
      - PGRST_DB_URI=postgres://authenticator:postgres-super-secure-authenticator-password@db:5432/postgres
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------
  # 4. Local Supabase: Kong Declarative Gateway
  # ----------------------------------------------------
  kong:
    image: kong:3.0-alpine
    container_name: supabase-local-kong
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
    volumes:
      - ./supabase/kong.yml:/usr/local/kong/kong.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      - rest

volumes:
  supabase-db-data:
